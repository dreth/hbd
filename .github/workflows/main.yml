name: Build and deploy HBD
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify local and production images
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -eu
          docker build -f local.Dockerfile -t hbd-verify:local .
          docker build -f prod.Dockerfile -t hbd-verify:production .
  deploy-server:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: self-hosted
    concurrency:
      group: hbd-production
      cancel-in-progress: false
    steps:
      - name: Deploy the verified main commit
        env:
          HBD_DEPLOY_DIRECTORY: ${{ secrets.SERVER_DIR }}
          HBD_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          cd "$HBD_DEPLOY_DIRECTORY"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$HBD_EXPECTED_COMMIT"
          git merge --ff-only "$HBD_EXPECTED_COMMIT"
          docker compose up -d --no-deps --build hbd
